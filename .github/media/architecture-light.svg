<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-label="agentOS architecture. @rivet-dev/agentos-core or the hosted agentOS Actor controls the agentOS sidecar process. Inside it, the trusted kernel owns processes, the filesystem, networking, and permissions. Untrusted guest code runs in V8 isolates for JavaScript and TypeScript and in WebAssembly for the shell, coreutils, and Python, and reaches the kernel only through syscalls across the security boundary." style="font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E4034"/></marker>
  </defs>

  <text x="220" y="16" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#56524a">@rivet-dev/agentos-core  or  agentOS Actor</text>
  <line x1="220" y1="23" x2="220" y2="43" stroke="#2E4034" stroke-width="1.3" marker-end="url(#architecture-arrow)"/>

  <rect x="10" y="44" width="420" height="276" rx="10" fill="#faf8f3" stroke="#2E4034" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="24" y="62" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.14em" fill="#2E4034">AGENTOS SIDECAR PROCESS</text>

  <rect x="30" y="74" width="380" height="88" rx="8" fill="#e7ece7" stroke="#1b1916" stroke-width="1.3"/>
  <text x="46" y="97" font-size="13" font-weight="600" fill="#1b1916">Kernel</text>
  <text x="394" y="97" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#2E4034">TRUSTED</text>
  <g fill="#ffffff" stroke="#1b1916" stroke-width="1.1">
    <rect x="46" y="110" width="81" height="36" rx="5"/>
    <rect x="135" y="110" width="81" height="36" rx="5"/>
    <rect x="224" y="110" width="81" height="36" rx="5"/>
    <rect x="313" y="110" width="81" height="36" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#1b1916">
    <text x="86.5" y="132">Processes</text>
    <text x="175.5" y="132">Filesystem</text>
    <text x="264.5" y="132">Networking</text>
    <text x="353.5" y="132">Permissions</text>
  </g>

  <text x="30" y="184" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#d63e00">SECURITY BOUNDARY</text>
  <line x1="30" y1="189" x2="410" y2="189" stroke="#d63e00" stroke-width="1.3" stroke-dasharray="4 4"/>
  <text x="228" y="184" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#56524a">syscalls</text>

  <rect x="30" y="210" width="380" height="94" rx="8" fill="#ffffff" stroke="#1b1916" stroke-width="1.3"/>
  <text x="46" y="233" font-size="13" font-weight="600" fill="#1b1916">Guest code</text>
  <text x="394" y="233" text-anchor="end" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#d63e00">UNTRUSTED</text>
  <g fill="#faf8f3" stroke="#1b1916" stroke-width="1.1">
    <rect x="46" y="244" width="170" height="46" rx="5"/>
    <rect x="224" y="244" width="170" height="46" rx="5"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#1b1916">
    <text x="131" y="263">V8 isolates</text>
    <text x="309" y="263">WebAssembly</text>
  </g>
  <g text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#56524a">
    <text x="131" y="280">JavaScript, TypeScript</text>
    <text x="309" y="280">shell, coreutils, Python</text>
  </g>

  <line x1="220" y1="164" x2="220" y2="208" stroke="#2E4034" stroke-width="1.3" marker-start="url(#architecture-arrow)" marker-end="url(#architecture-arrow)"/>
</svg>
