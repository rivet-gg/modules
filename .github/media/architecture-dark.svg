<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 236" width="560" height="236" role="img" aria-label="agentOS architecture. @rivet-dev/agentos-core or the hosted agentOS Actor controls a trusted sidecar that owns processes, the filesystem, networking, and permissions. Below a security boundary, untrusted executors run guest code in V8 isolates for JavaScript and TypeScript, WebAssembly for the shell, coreutils, and tools, and Pyodide for Python, and reach the sidecar only through syscalls." style="font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="architecture-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d4d4d8"/></marker>
  </defs>

  <text x="280" y="16" text-anchor="middle" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">@rivet-dev/agentos-core  or  hosted agentOS Actor</text>
  <line x1="280" y1="23" x2="280" y2="41" stroke="#d4d4d8" stroke-width="1.3" marker-end="url(#architecture-arrow)"/>

  <rect x="10" y="42" width="540" height="58" rx="9" fill="#26262a" stroke="#ffffff" stroke-width="1.3"/>
  <text x="24" y="62" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.14em" fill="#d4d4d8">SIDECAR · TRUSTED</text>
  <text x="24" y="86" font-size="13" font-weight="600" fill="#ffffff">Processes · Filesystem · Networking · Permissions &amp; limits</text>

  <text x="10" y="123" font-size="9.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.12em" fill="#d36945">SECURITY BOUNDARY</text>
  <line x1="138" y1="120" x2="550" y2="120" stroke="#d36945" stroke-width="1.3" stroke-dasharray="4 4"/>

  <rect x="10" y="140" width="540" height="86" rx="9" fill="#161618" stroke="#d4d4d8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="24" y="158" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" letter-spacing="0.14em" fill="#d4d4d8">EXECUTORS · UNTRUSTED</text>
  <g fill="#0c0c0e" stroke="#ffffff" stroke-width="1.3">
    <rect x="40" y="166" width="150" height="48" rx="6"/>
    <rect x="205" y="166" width="150" height="48" rx="6"/>
    <rect x="370" y="166" width="150" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">
    <text x="115" y="186">V8 isolates</text>
    <text x="280" y="186">WebAssembly</text>
    <text x="445" y="186">Pyodide</text>
  </g>
  <g text-anchor="middle" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">
    <text x="115" y="203">JavaScript, TypeScript</text>
    <text x="280" y="203">shell, coreutils, tools</text>
    <text x="445" y="203">Python</text>
  </g>

  <line x1="280" y1="102" x2="280" y2="164" stroke="#d4d4d8" stroke-width="1.3" marker-start="url(#architecture-arrow)" marker-end="url(#architecture-arrow)"/>
  <text x="288" y="114" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#d4d4d8">syscalls</text>
</svg>
